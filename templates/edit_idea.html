{% extends "base.html" %}

{% block title %}Редактирование идеи - Админ панель{% endblock %}

{% block content %}
<div class="container-fluid px-4">
    <h1 class="mt-4 mb-4 text-success fw-bold">
        <i class="bi bi-pencil-square me-2"></i>Редактирование идеи #{{ idea.id }}
    </h1>

    <div class="card shadow border-0">
        <div class="card-header bg-success text-white">
            <h6 class="m-0 fw-bold">
                <i class="bi bi-pencil me-2"></i>Редактирование идеи
            </h6>
        </div>
        <div class="card-body">
            <form id="editIdeaForm">
                <div class="mb-3">
                    <label class="form-label fw-bold">Название</label>
                    <input type="text" class="form-control" id="title" value="{{ idea.title }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Описание</label>
                    <textarea class="form-control" id="description" rows="5" required>{{ idea.description }}</textarea>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Категория</label>
                        <select class="form-select" id="category" required>
                            <option value="спорт" {% if idea.category == 'спорт' %}selected{% endif %}>Спорт</option>
                            <option value="культура" {% if idea.category == 'культура' %}selected{% endif %}>Культура</option>
                            <option value="детский досуг" {% if idea.category == 'детский досуг' %}selected{% endif %}>Детский досуг</option>
                            <option value="экология" {% if idea.category == 'экология' %}selected{% endif %}>Экология</option>
                            <option value="транспорт" {% if idea.category == 'транспорт' %}selected{% endif %}>Транспорт</option>
                            <option value="озеленение" {% if idea.category == 'озеленение' %}selected{% endif %}>Озеленение</option>
                            <option value="освещение" {% if idea.category == 'освещение' %}selected{% endif %}>Освещение</option>
                            <option value="безопасность" {% if idea.category == 'безопасность' %}selected{% endif %}>Безопасность</option>
                            <option value="другое" {% if idea.category == 'другое' %}selected{% endif %}>Другое</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Статус</label>
                        <select class="form-select" id="status" required>
                            <option value="pending" {% if idea.status == 'pending' %}selected{% endif %}>На рассмотрении</option>
                            <option value="approved" {% if idea.status == 'approved' %}selected{% endif %}>Одобрено</option>
                            <option value="rejected" {% if idea.status == 'rejected' %}selected{% endif %}>Отклонено</option>
                            <option value="implemented" {% if idea.status == 'implemented' %}selected{% endif %}>Реализовано</option>
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Широта</label>
                        <input type="text" class="form-control" id="latitude" value="{{ idea.latitude }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Долгота</label>
                        <input type="text" class="form-control" id="longitude" value="{{ idea.longitude }}" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Количество голосов</label>
                    <input type="number" class="form-control" id="votes_count" value="{{ idea.votes_count }}" min="0">
                </div>
                <div class="mt-4 d-flex gap-2">
                    <button type="button" class="btn btn-success" onclick="saveIdea()">
                        <i class="bi bi-save me-1"></i>Сохранить изменения
                    </button>
                    <a href="{{ url_for('admin_ideas') }}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i>Назад к списку
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
async function saveIdea() {
    const ideaData = {
        title: document.getElementById('title').value,
        description: document.getElementById('description').value,
        category: document.getElementById('category').value,
        status: document.getElementById('status').value,
        latitude: parseFloat(document.getElementById('latitude').value),
        longitude: parseFloat(document.getElementById('longitude').value),
        votes_count: parseInt(document.getElementById('votes_count').value)
    };
    try {
        const response = await fetch(`/api/admin/ideas/{{ idea.id }}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(ideaData)
        });
        const data = await response.json();
        if (data.success) {
            alert('Изменения сохранены');
            window.location.href = "{{ url_for('admin_ideas') }}";
        } else {
            alert('Ошибка при сохранении');
        }
    } catch (error) {
        alert('Ошибка при сохранении');
        console.error(error);
    }
}
</script>
{% endblock %}
